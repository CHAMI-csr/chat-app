services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chaty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: chaty
    volumes:
      - chaty-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaty -d chaty"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://chaty:${POSTGRES_PASSWORD}@postgres:5432/chaty?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      FILE_STORAGE_DIR: /data/files
    volumes:
      - chaty-files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
    networks: [private]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CHATY_DOMAIN: ${CHATY_DOMAIN:?Set CHATY_DOMAIN to a domain pointed at this VPS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

networks:
  private:

volumes:
  chaty-db:
  chaty-files:
  caddy-data:
  caddy-config:
