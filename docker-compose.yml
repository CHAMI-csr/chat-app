services:
  postgres:
    image: postgres:16-alpine
    container_name: chaty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chaty_dev
      POSTGRES_DB: chaty
    ports:
      - "5432:5432"
    volumes:
      - chaty-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaty"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  chaty-postgres-data:
